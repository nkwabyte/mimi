name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test-macos:
    name: Tests (macOS Bash 3.2)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify macOS system bash version
        run: |
          /bin/bash --version
          echo "System bash is at /bin/bash"

      - name: Install bats-core
        run: |
          brew install bats-core

      - name: Syntax check
        run: |
          for f in clean.sh bin/mimi lib/load.sh lib/*/*.sh libexec/mimi-root-apply scripts/*.sh; do
            /bin/bash -n "$f"
          done

      - name: Compile the root launcher
        run: |
          cc -Wall -Wextra -Werror -o "$RUNNER_TEMP/mimi-root-launch" libexec/mimi-root-launch.c

      - name: Run Bats test suite
        run: |
          ./tests/run < /dev/null

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-failure-logs
          path: |
            ${{ runner.temp }}/**/clean-*.log
          retention-days: 7

  # The same suite on Linux with GNU tools and a newer bash: a faster second
  # opinion, and a check that nothing depends on BSD-only flags outside
  # lib/core/platform.sh. Tests that need macOS itself, or a macOS tool with
  # no mock, skip here; the macOS job above runs all of them.
  test-linux:
    name: Tests (Linux, GNU tools)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install bats-core, zsh and ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y bats zsh shellcheck
          bats --version

      - name: Run Bats test suite
        run: |
          ./tests/run < /dev/null

  gui:
    name: GUI build and unit tests
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The project needs Xcode 26 or later (Swift 6.2 isolation settings)
      # and keeps the Xcode 16 project format. Pick the newest installed
      # Xcode by name so a change of the image's default does not change
      # this job.
      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Build and test
        run: |
          xcodebuild -project gui/Mimi/Mimi.xcodeproj -scheme Mimi \
            -destination 'platform=macOS' -only-testing:MimiTests \
            -resultBundlePath "$RUNNER_TEMP/gui-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO test

      # xcodebuild names a failing Swift Testing test but not the failed
      # expectation; the result bundle has it.
      - name: Show failed expectations
        if: failure()
        run: |
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/gui-tests.xcresult" \
            | python3 -c 'import json,sys
          def walk(n, path=""):
              name = n.get("name", "")
              if n.get("nodeType") == "Failure Message":
                  print(path, "->", name)
              for c in n.get("children", []):
                  walk(c, path + "/" + name if n.get("nodeType") == "Test Case" else path or name)
          for n in json.load(sys.stdin).get("testNodes", []):
              walk(n)'

  static-checks:
    name: Static Analysis & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck -x clean.sh bin/mimi
          shellcheck -S warning lib/*/*.sh libexec/mimi-root-apply scripts/*.sh install.sh

      - name: Check documentation trailing whitespace
        run: |
          if git grep -n '[[:blank:]]$' '*.md'; then
            echo "ERROR: Trailing whitespace detected in documentation files." >&2
            exit 1
          fi
