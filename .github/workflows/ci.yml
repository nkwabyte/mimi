name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test-macos:
    name: Tests (macOS Bash 3.2)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify macOS system bash version
        run: |
          /bin/bash --version
          echo "System bash is at /bin/bash"

      - name: Install bats-core
        run: |
          brew install bats-core

      - name: Syntax check
        run: |
          for f in clean.sh bin/mimi lib/load.sh lib/*/*.sh libexec/mimi-root-apply scripts/*.sh; do
            /bin/bash -n "$f"
          done

      - name: Compile the root launcher
        run: |
          cc -Wall -Wextra -Werror -o "$RUNNER_TEMP/mimi-root-launch" libexec/mimi-root-launch.c

      - name: Run Bats test suite
        run: |
          ./tests/run < /dev/null

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-failure-logs
          path: |
            ${{ runner.temp }}/**/clean-*.log
          retention-days: 7

  gui:
    name: GUI build and unit tests
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The project needs the newest Xcode (it was created with Xcode 27 and
      # uses Swift 6.2 isolation settings). Pick the newest installed one by
      # name so a change of the image's default does not change this job.
      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Build and test
        run: |
          xcodebuild -project gui/Mimi/Mimi.xcodeproj -scheme Mimi \
            -destination 'platform=macOS' -only-testing:MimiTests \
            CODE_SIGNING_ALLOWED=NO test

  static-checks:
    name: Static Analysis & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck -x clean.sh bin/mimi
          shellcheck -S warning lib/*/*.sh libexec/mimi-root-apply scripts/*.sh install.sh

      - name: Check documentation trailing whitespace
        run: |
          if git grep -n '[[:blank:]]$' '*.md'; then
            echo "ERROR: Trailing whitespace detected in documentation files." >&2
            exit 1
          fi
