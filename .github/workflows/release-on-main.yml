name: Release on Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Version
        id: version
        run: |
          VERSION="$(sed -n 's/^MIMI_VERSION="\(.*\)"$/\1/p' lib/core/globals.sh)"
          if [ -z "$VERSION" ]; then
            echo "ERROR: Unable to extract MIMI_VERSION from lib/core/globals.sh" >&2
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if release or tag already exists
        id: check_tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping release creation."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG is new."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Release Notes from CHANGELOG
        if: steps.check_tag.outputs.exists == 'false'
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES="$(awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba')"

          if [ -z "$NOTES" ]; then
            NOTES="$(awk '
              index($0, "## [Unreleased]") == 1 { on = 1; next }
              on && index($0, "## [") == 1 { exit }
              on { print }
            ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba')"
          fi

          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION of mimi."
          fi

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Git Tag and GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "mimi $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "mimi $TAG" --notes "$NOTES"
