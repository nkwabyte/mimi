name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to tap (e.g. v0.1.0)'
        required: true
        type: string

jobs:
  update-tap:
    name: Update Homebrew Tap Formula
    runs-on: ubuntu-latest
    steps:
      - name: Determine release tag
        id: vars
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "ERROR: No tag specified or available in event." >&2
            exit 1
          fi
          # Same rule as scripts/validate-tag.sh. Kept inline because this
          # step runs before the tagged source is checked out.
          case "$TAG" in
            *$'\n'*|*$'\r'*|*' '*)
              echo "ERROR: tag contains whitespace." >&2
              exit 1
              ;;
          esac
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag '$TAG' is not valid semantic version (vX.Y.Z)." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.tag }}
          path: mimi-src

      - name: Refuse a tag that does not match MIMI_VERSION
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          CODE_VERSION="$(sed -n 's/^MIMI_VERSION="\(.*\)"$/\1/p' mimi-src/lib/core/globals.sh)"
          if [ "$CODE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "ERROR: tag $RELEASE_TAG does not match MIMI_VERSION=\"$CODE_VERSION\" in lib/core/globals.sh." >&2
            echo "Bump MIMI_VERSION (and CHANGELOG.md) before tagging." >&2
            exit 1
          fi
          echo "MIMI_VERSION matches the tag: $CODE_VERSION"

      - name: Compute SHA-256 Checksum
        id: checksum
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          URL="https://github.com/nkwabyte/mimi/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          echo "Downloading archive from $URL"
          SHA256="$(curl -sSfL "$URL" | sha256sum | awk '{print $1}')"
          if [ -z "$SHA256" ] || [ "${#SHA256}" -ne 64 ]; then
            echo "ERROR: Failed to compute valid SHA256 (got '$SHA256')" >&2
            exit 1
          fi
          echo "Computed SHA256: $SHA256"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-mimi
        uses: actions/checkout@v7
        with:
          repository: nkwabyte/homebrew-mimi
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-mimi

      - name: Update Formula
        run: |
          mkdir -p homebrew-mimi/Formula
          cat <<EOF > homebrew-mimi/Formula/mimi.rb
          class Mimi < Formula
            desc "macOS junk and developer cache cleaner (Xcode/simulator aware)"
            homepage "https://github.com/nkwabyte/mimi"
            url "${{ steps.checksum.outputs.url }}"
            sha256 "${{ steps.checksum.outputs.sha256 }}"
            license "MIT"

            def install
              prefix.install "bin", "lib", "libexec", "schemas"
              bash_completion.install "completions/mimi.bash" => "mimi"
              zsh_completion.install "completions/_mimi"
              man1.install "man/mimi.1"
            end

            test do
              assert_match "mimi #{version}", shell_output("#{bin}/mimi --version")
            end
          end
          EOF

      - name: Commit and push changes
        working-directory: homebrew-mimi
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mimi.rb
          if git diff --staged --quiet; then
            echo "Formula already up-to-date with this version and checksum."
          else
            git commit -m "Update mimi formula to ${RELEASE_TAG}"
            git push origin main
          fi
